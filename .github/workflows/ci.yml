name: CI and app artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests and quality gates
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Run repository verification
        run: make verify

  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Build macOS app
        run: >-
          xcodebuild
          -project PDFClean.xcodeproj
          -scheme PDFClean-macOS
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package DMG
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData-macOS/Build/Products/Release/PDFClean.app"
          STAGING_PATH="$RUNNER_TEMP/PDFClean-dmg"
          test -d "$APP_PATH"
          mkdir -p "$STAGING_PATH"
          ditto "$APP_PATH" "$STAGING_PATH/PDFClean.app"
          ln -s /Applications "$STAGING_PATH/Applications"
          hdiutil create \
            -volname PDFClean \
            -srcfolder "$STAGING_PATH" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/PDFClean-macOS.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFClean-macOS-DMG
          path: ${{ runner.temp }}/PDFClean-macOS.dmg
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: Build iPhone Simulator app
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project PDFClean.xcodeproj
          -scheme PDFClean-iOS
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package Simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData-iOS/Build/Products/Release-iphonesimulator/PDFClean.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$RUNNER_TEMP/PDFClean-iPhone-Simulator.zip"

      - name: Upload iPhone Simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFClean-iPhone-Simulator
          path: ${{ runner.temp }}/PDFClean-iPhone-Simulator.zip
          if-no-files-found: error
          retention-days: 14
