name: iOS device IPA

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: Build a signed IPA for TestFlight or App Store Connect
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  ios-device-ipa:
    name: Archive signed iOS app
    if: ${{ inputs.build_ipa }}
    runs-on: macos-26
    environment: ios-signing
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Import signing certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64:?Missing signing certificate secret}"
          : "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:?Missing signing certificate password secret}"
          : "${IOS_APP_STORE_PROFILE_BASE64:?Missing App Store provisioning profile secret}"
          : "${IOS_TEAM_ID:?Missing Apple Developer Team ID secret}"

          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-app-store.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive iPhone app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: >-
          xcodebuild
          -project PDFClean.xcodeproj
          -scheme PDFClean-iOS
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/PDFClean-iOS.xcarchive"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          DEVELOPMENT_TEAM="$IOS_TEAM_ID"
          PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID"
          archive

      - name: Export signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/ios-export"
          plutil -create xml1 "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.maxbehzadi.pdfclean string $IOS_PROFILE_UUID" "$EXPORT_OPTIONS"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PDFClean-iOS.xcarchive" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          test -f "$EXPORT_PATH/PDFClean.ipa"
          security delete-keychain "$IOS_KEYCHAIN_PATH"

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFClean-iPhone-IPA
          path: ${{ runner.temp }}/ios-export/PDFClean.ipa
          if-no-files-found: error
          retention-days: 14
